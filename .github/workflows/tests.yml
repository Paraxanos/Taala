name: tests

on:
  push:
    branches: [main, V2]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # A fresh clone has no word lists and no password corpus; tests that need them skip.
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke test
        run: python -m taala.cli "pyaar123"
        env:
          PYTHONIOENCODING: utf-8
